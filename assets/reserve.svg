etica,Arial,sans-serif" font-size="12" fill="#bda98b">Application published by the</text><text x="384" y="185" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#bda98b">Indian Patent Office.</text><rect x="618" y="18" width="240" height="187" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M636 19.2 H840" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="638" y="52" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#cfa75c" letter-spacing="2.6">COMPETITION</text><text x="638" y="102" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="46" fill="#cfa75c">90/100</text><text x="638" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#bda98b">DD Robocon 2026 preliminary round,</text><text x="638" y="147" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#bda98b">through to the National Finals at</text><text x="638" y="164" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#bda98b">IIT Delhi.</text><rect x="364" y="219" width="240" height="187" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M382 220.2 H586" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="384" y="253" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#cfa75c" letter-spacing="2.6">CERTIFICATION</text><text x="384" y="281" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="16.5" fill="#efdfc4">AWS Certified AI</text><text x="384" y="302" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="16.5" fill="#efdfc4">Practitioner</text><text x="384" y="327" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#bda98b">Passed Octob