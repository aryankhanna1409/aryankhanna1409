<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 190" width="100%" role="img" aria-label="auto_wordle: A bot that opens today's Wordle, reads the tiles and solves it for you."><defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcf7ec"/><stop offset=".6" stop-color="#f5ead5"/><stop offset="1" stop-color="#eedfc4"/></linearGradient>
<radialGradient id="lamp" cx=".84" cy="0" r=".95"><stop offset="0" stop-color="#e2bd72" stop-opacity=".40"/><stop offset="1" stop-color="#e2bd72" stop-opacity="0"/></radialGradient>
<radialGradient id="ember" cx="0" cy=".7" r=".8"><stop offset="0" stop-color="#e3b48a" stop-opacity=".40"/><stop offset="1" stop-color="#e3b48a" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".70"/><stop offset="1" stop-color="#ffffff" stop-opacity=".32"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6d6" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity=".35"/></linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c79a46"/><stop offset=".5" stop-color="#9a6b1f"/><stop offset="1" stop-color="#6b4513"/></linearGradient>
<linearGradient id="neo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#efe2c8"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6b1f" stop-opacity=".75"/><stop offset="1" stop-color="#9a6b1f" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".11 .005" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .30  0 0 0 0 .15  1.0 0 0 0 -.36"/></filter>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
<filter id="soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="lift" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#6b4a22" flood-opacity=".28"/><feDropShadow dx="-2" dy="-2" stdDeviation="2.5" flood-color="#ffffff" flood-opacity=".9"/></filter>
<mask id="feather"><rect x="13" y="13" width="406" height="164" rx="18" fill="#fff" filter="url(#soft)"/></mask>
<clipPath id="clip"><rect width="432" height="190" rx="18"/></clipPath>
</defs><g mask="url(#feather)"><rect width="432" height="190" fill="url(#wall)"/><rect width="432" height="190" fill="url(#ember)"/><rect width="432" height="190" fill="url(#lamp)"/><rect width="432" height="190" filter="url(#grain)" opacity=".35"/></g><text x="26" y="38" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#9a6b1f" letter-spacing="2.6">OFF THE MENU</text><text x="24" y="76" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="30" fill="#2c1a10">auto_wordle</text><text x="26" y="104" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b5238">A bot that opens today's Wordle, reads the tiles and</text><text x="26" y="124" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b5238">solves it for you.</text><text x="26" y="168" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#9a6b1f" letter-spacing="1.2">PYTHON · PLAYWRIGHT</text><g transform="translate(398,34) rotate(-28)"><ellipse rx="5.8" ry="8" fill="url(#brass)"/><path d="M0 -6.4c3.6 4.0 -3.6 8.8 0 12.8" fill="none" stroke="#fff7e6" stroke-opacity=".7" stroke-width="1"/></g></svg>