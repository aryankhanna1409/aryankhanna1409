vetica,Arial,sans-serif" font-size="12" fill="#6b5238">Application published by the</text><text x="384" y="185" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#6b5238">Indian Patent Office.</text><rect x="618" y="18" width="240" height="187" rx="18" fill="url(#glass)" stroke="#9a6b1f" stroke-opacity=".34"/><path d="M636 19.2 H840" stroke="#ffffff" stroke-opacity=".22" stroke-linecap="round"/><text x="638" y="52" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#9a6b1f" letter-spacing="2.6">COMPETITION</text><text x="638" y="102" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="46" fill="#9a6b1f">90/100</text><text x="638" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#6b5238">DD Robocon 2026 preliminary round,</text><text x="638" y="147" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#6b5238">through to the National Finals at</text><text x="638" y="164" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#6b5238">IIT Delhi.</text><rect x="364" y="219" width="240" height="187" rx="18" fill="url(#glass)" stroke="#9a6b1f" stroke-opacity=".34"/><path d="M382 220.2 H586" stroke="#ffffff" stroke-opacity=".22" stroke-linecap="round"/><text x="384" y="253" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#9a6b1f" letter-spacing="2.6">CERTIFICATION</text><text x="384" y="281" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="16.5" fill="#2c1a10">AWS Certified AI</text><text x="384" y="302" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="16.5" fill="#2c1a10">Practitioner</text><text x="384" y="327" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#6b5238">Passed Octo