<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 46" width="100%" role="img" aria-label="Email" shape-rendering="crispEdges" font-family="Geneva, Monaco, 'Courier New', Courier, monospace"><defs>
<pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#0d1117"/><rect width="2" height="2" fill="#e6edf3"/><rect x="2" y="2" width="2" height="2" fill="#e6edf3"/></pattern>
<pattern id="light" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#0d1117"/><rect width="1" height="1" fill="#e6edf3"/><rect x="2" y="2" width="1" height="1" fill="#e6edf3"/></pattern>
