fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><text x="196" y="60" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="24" fill="#efdfc4">Forward Deployed Engineer Intern</text><text x="196" y="82" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#cfa75c">Incedo · Hi-Tech · Pune</text><text x="196" y="108" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">Joining for six months through the North Stars intern program, one of 14 students selected</text><text x="196" y="128" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">from SIT. Pre-joining work so far: the AWS AI Practitioner certification and the nexus</text><text x="196" y="148" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">project.</text><rect x="18" y="176" width="844" height="144" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M36 177.2 H844" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="42" y="214" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#bda98b" letter-spacing="1">SEP 2024 – NOW</text><g transform="translate(48,238) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(65,238) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(82,238) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(99,238) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(116,238) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><text x="196" y="218" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="24" fill="#efdfc4">Research Assistant</text><text x="196" y="240" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#cfa75c">Symbiosis Institute of Technology</text><text x="196" y="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">Applied research across machine learning, autonomous robots and computer vision. Built the</text><text x="196" y="286" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">credit-card reward system that reached R² 0.99 and a 62.5% improvement in personalisation,</text><text x="196" y="306" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">worked on the IoT warehouse robot, and now the multimodal search-and-rescue system.</text><rect x="18" y="334" width="844" height="144" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M36 335.2 H844" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="42" y="372" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#bda98b" letter-spacing="1">JAN – JUN 2026</text><g transform="translate(48,396) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(65,396) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(82,396) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(99,396) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(116,396) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><text x="196" y="376" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="24" fill="#efdfc4">Documentation Lead &amp; Vision Mentor</text><text x="196" y="398" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#cfa75c">Team Robominds · DD Robocon 2026</text><text x="196" y="424" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">Helped lead vision across two robots: camera calibration, model training, datasets and</text><text x="196" y="444" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">testing. Deployed the vision pipeline for the navigation team and taught the basics to</text><text x="196" y="464" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">juniors. The team scored 90/100 and reached the National Finals at IIT Delhi.</text><rect x="18" y="492" width="844" height="124" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M36 493.2 H844" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="42" y="530" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#bda98b" letter-spacing="1">JUL – DEC 2025</text><g transform="translate(48,554) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(65,554) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(82,554) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(99,554) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(116,554) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><text x="196" y="534" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="24" fill="#efdfc4">Research Intern</text><text x="196" y="556" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#cfa75c">SCAAI · Symbiosis Centre for Applied AI</text><text x="196" y="582" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">Built and evaluated models for applied AI projects focused on deployment, compliance and</text><text x="196" y="602" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">automation, and designed the experiments that validated them.</text><rect x="18" y="630" width="844" height="124" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M36 631.2 H844" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="42" y="668" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#bda98b" letter-spacing="1">MAR – DEC 2025</text><g transform="translate(48,692) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(65,692) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(82,692) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(99,692) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(116,692) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><text x="196" y="672" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="24" fill="#efdfc4">Club Head, Robotic Process Automation</text><text x="196" y="694" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#cfa75c">Department of Robotics and Automation, SIT</text><text x="196" y="720" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">Re-established the club and ran 5+ workshops, webinars and industry events for 150+</text><text x="196" y="740" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">students.</text><rect x="18" y="768" width="844" height="124" rx="18" fill="url(#glass)" stroke="#cfa75c" stroke-opacity=".34"/><path d="M36 769.2 H844" stroke="#fff0d2" stroke-opacity=".22" stroke-linecap="round"/><text x="42" y="806" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#bda98b" letter-spacing="1">AUG 2025 – NOW</text><g transform="translate(48,830) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(65,830) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="url(#brass)"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(82,830) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(99,830) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(116,830) rotate(-24)"><ellipse rx="4.7" ry="6.5" fill="#cfa75c" fill-opacity=".18"/><path d="M0 -5.2c2.9 3.2 -2.9 7.2 0 10.4" fill="none" stroke="#1a0f08" stroke-opacity=".7" stroke-width="1"/></g><text x="196" y="810" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="24" fill="#efdfc4">Student Coordinator</text><text x="196" y="832" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#cfa75c">Campus Wellness Advisory Committee · SCHC</text><text x="196" y="858" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">Coordinates student-facing programs that reach 500+ students and keeps students and faculty</text><text x="196" y="878" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#bda98b">talking to each other.</text></svg>