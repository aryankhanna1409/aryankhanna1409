<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" role="img" aria-label="Thanks for stopping by" shape-rendering="crispEdges" font-family="Geneva, Monaco, 'Courier New', Courier, monospace"><defs>
