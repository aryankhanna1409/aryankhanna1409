<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" role="img" aria-label="The loop: move, see, know, act, ship" shape-rendering="crispEdges" font-family="Geneva, Monaco, 'Courier New', Courier, monospace"><defs>
<pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="2" height="2" fill="#000"/><rect x="2" y="2" width="2" height="2" fill="#000"/></pattern>
<pattern id="light" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern>
<pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect y="1" width="4" height="1" fill="#000"/></pattern>
<pattern id="gray" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#fff"/><rect width="1" height="1" fill="#000"/></pattern>
</defs><rect width="880" height="330" fill="url(#dither)"/><rect x="21" y="17" width="838" height="290" fill="#000"/><rect x="18" y="14" width="838" height="290" fill="#fff" stroke="#000" stroke-width="2"/><rect x="19" y="15" width="836" height="22" fill="url(#stripes)"/><line x1="18" y1="38" x2="856" y2="38" stroke="#000" stroke-width="2"/><rect x="28" y="20" width="13" height="13" fill="#fff" stroke="#000" stroke-width="2"/><rect x="305.0" y="17" width="264" height="18" fill="#fff"/><text x="437.0" y="31" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">The Loop: five stops, one idea</text><rect x="77" y="71" width="124" height="104" fill="#000"/><rect x="74" y="68" width="124" height="104" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="136.0" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">01</text><g transform="translate(112.0,98)" fill="none" stroke="#000" stroke-width="3"><rect x="8" y="14" width="32" height="18"/><rect x="2" y="30" width="10" height="8" fill="#000"/><rect x="36" y="30" width="10" height="8" fill="#000"/><circle cx="24" cy="10" r="4" fill="#000"/></g><text x="136.0" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">MOVE</text><text x="136.0" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">autonomous-bot</text><text x="136.0" y="212" font-size="10" text-anchor="middle" fill="#000">a robot that</text><text x="136.0" y="224" font-size="10" text-anchor="middle" fill="#000">maps and navigates</text><line x1="202" y1="120" x2="218" y2="120" stroke="#000" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/></line><path d="M214 114 l8 6 l-8 6z" fill="#000"/><rect x="231" y="71" width="124" height="104" fill="#000"/><rect x="228" y="68" width="124" height="104" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="290.0" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">02</text><g transform="translate(266.0,98)" fill="none" stroke="#000" stroke-width="3"><path d="M2 22 Q24 2 46 22 Q24 42 2 22z"/><circle cx="24" cy="22" r="7" fill="#000"/></g><text x="290.0" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">SEE</text><text x="290.0" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">sentinel</text><text x="290.0" y="212" font-size="10" text-anchor="middle" fill="#000">vision that finds people</text><text x="290.0" y="224" font-size="10" text-anchor="middle" fill="#000">in the dark</text><line x1="356" y1="120" x2="372" y2="120" stroke="#000" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/></line><path d="M368 114 l8 6 l-8 6z" fill="#000"/><rect x="385" y="71" width="124" height="104" fill="#000"/><rect x="382" y="68" width="124" height="104" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="444.0" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">03</text><g transform="translate(420.0,98)" fill="none" stroke="#000" stroke-width="3"><rect x="8" y="3" width="32" height="38"/><line x1="14" y1="13" x2="34" y2="13"/><line x1="14" y1="21" x2="34" y2="21"/><line x1="14" y1="29" x2="26" y2="29"/></g><text x="444.0" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">KNOW</text><text x="444.0" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">finintel</text><text x="444.0" y="212" font-size="10" text-anchor="middle" fill="#000">AI that cites</text><text x="444.0" y="224" font-size="10" text-anchor="middle" fill="#000">its sources</text><line x1="510" y1="120" x2="526" y2="120" stroke="#000" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/></line><path d="M522 114 l8 6 l-8 6z" fill="#000"/><rect x="539" y="71" width="124" height="104" fill="#000"/><rect x="536" y="68" width="124" height="104" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="598.0" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">04</text><g transform="translate(574.0,98)" fill="none" stroke="#000" stroke-width="3"><circle cx="24" cy="22" r="17"/><path d="M19 13 L33 22 L19 31z" fill="#000"/></g><text x="598.0" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">ACT</text><text x="598.0" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">nexus</text><text x="598.0" y="212" font-size="10" text-anchor="middle" fill="#000">an agent that</text><text x="598.0" y="224" font-size="10" text-anchor="middle" fill="#000">fixes incidents</text><line x1="664" y1="120" x2="680" y2="120" stroke="#000" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/></line><path d="M676 114 l8 6 l-8 6z" fill="#000"/><rect x="693" y="71" width="124" height="104" fill="#000"/><rect x="690" y="68" width="124" height="104" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="752.0" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">05</text><g transform="translate(728.0,98)" fill="none" stroke="#000" stroke-width="3"><rect x="3" y="5" width="42" height="34"/><line x1="3" y1="14" x2="45" y2="14"/><rect x="9" y="20" width="12" height="12" fill="#000"/><line x1="27" y1="22" x2="39" y2="22"/><line x1="27" y1="30" x2="39" y2="30"/></g><text x="752.0" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">SHIP</text><text x="752.0" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">dishdecoded</text><text x="752.0" y="212" font-size="10" text-anchor="middle" fill="#000">a product people</text><text x="752.0" y="224" font-size="10" text-anchor="middle" fill="#000">can use</text><path d="M818 120 H840 V246 H48 V120 H68" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.2s" repeatCount="indefinite"/></path><path d="M62 114 l8 6 l-8 6z" fill="#000"/><rect x="334.0" y="237" width="220" height="18" fill="#fff"/><text x="444.0" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">what the system learns feeds back</text><rect x="-5" y="-5" width="10" height="10" fill="#000"><animateMotion path="M136.0 60 H840 V246 H48 V60 Z" dur="7s" repeatCount="indefinite"/></rect></svg>