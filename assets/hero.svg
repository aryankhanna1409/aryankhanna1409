<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" role="img" aria-label="Hello, I'm Aryan: retro Macintosh desktop" shape-rendering="crispEdges" font-family="Geneva, Monaco, 'Courier New', Courier, monospace"><defs>
<pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
