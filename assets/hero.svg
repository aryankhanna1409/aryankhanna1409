</defs><rect width="880" height="380" fill="url(#dither)"/><rect width="880" height="26" fill="#fff"/><line x1="0" y1="26" x2="880" y2="26" stroke="#000" stroke-width="2"/><rect x="14" y="7" width="12" height="13" rx="2" fill="#000"/><text x="44" y="18" font-size="13" font-weight="bold" fill="#000">File</text><text x="98" y="18" font-size="13" font-weight="bold" fill="#000">Edit</text><text x="152" y="18" font-size="13" font-weight="bold" fill="#000">View</text><text x="206" y="18" font-size="13" font-weight="bold" fill="#000">Special</text><text x="864" y="18" font-size="13" text-anchor="end" fill="#000"><animate attributeName="opacity" values="1;1;1;1" dur="1s" repeatCount="indefinite"/>Pune, IN</text><rect x="51" y="59" width="784" height="290" fill="#000"/><rect x="48" y="56" width="784" height="290" fill="#fff" stroke="#000" stroke-width="2"/><rect x="49" y="57" width="782" height="22" fill="url(#stripes)"/><line x1="48" y1="80" x2="832" y2="80" stroke="#000" stroke-width="2"/><rect x="58" y="62" width="13" height="13" fill="#fff" stroke="#000" stroke-width="2"/><rect x="380.0" y="59" width="120" height="18" fill="#fff"/><text x="440.0" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Aryan Khanna</text><g transform="translate(64,100) scale(1.6)"><rect x="0" y="0" width="64" height="76" fill="#fff" stroke="#000" stroke-width="3"/><rect x="8" y="8" width="48" height="38" fill="#fff" stroke="#000" stroke-width="3"/><rect x="21" y="19" width="4" height="8" fill="#000"><animate attributeName="height" values="8;8;1;8;8" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="19;19;26;19;19" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></rect><rect x="38" y="19" width="4" height="8" fill="#000"><animate attributeName="height" values="8;8;1;8;8" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="19;19;26;19;19" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></rect><rect x="31" y="22" width="2" height="8" fill="#000"/><path d="M20 35 h4 v3 h16 v-3 h4" fill="none" stroke="#000" stroke-width="3"/><rect x="12" y="58" width="30" height="4" fill="#000"/><rect x="46" y="56" width="6" height="6" fill="#000"/></g><text x="210" y="140" font-size="44" font-weight="bold" fill="#000">Hello, I'm Aryan.</text><text x="212" y="172" font-size="16" fill="#000">Robotics engineer, moving up the stack to AI + software.</text><text x="212" y="226" font-size="20" font-weight="bold" fill="#000" opacity="0">Sensing  ·  Planning  ·  Learning<animate attributeName="opacity" values="1;1;0;0" keyTimes="0.000;0.332;0.333;1.000" dur="9s" repeatCount="indefinite" calcMode="discrete"/></text><text x="212" y="226" font-size="20" font-weight="bold" fill="#000" opacity="0">ROS 2  ·  YOLO  ·  RAG  ·  Embedded<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.332;0.333;0.666;0.667;1.000" dur="9s" repeatCount="indefinite" calcMode="discrete"/></text><text x="212" y="226" font-size="20" font-weight="bold" fill="#000" opacity="0">B.Tech Robotics '27  ·  Pune, India<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000;0.666;0.667;1.000" dur="9s" repeatCount="indefinite" calcMode="discrete"/></text><rect x="212" y="236" width="10" height="3" fill="#000"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="212" y="282" font-size="13" fill="#000">Loading projects…</text><rect x="212" y="290" width="440" height="16" fill="#fff" stroke="#000" stroke-width="2"/><rect x="214" y="292" width="0" height="12" fill="url(#gray)"><animate attributeName="width" values="0;436;436" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/></rect><rect x="214" y="292" width="0" height="12" fill="#000" opacity="0.0"/></svg>